name: minicrm
services:
  minicrm-nextjs:
    build:
      context: ../../
      dockerfile: docker/dev/Dockerfile.nextjs
    image: minicrm-nextjs
    container_name: minicrm-nextjs
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
  minicrm-postgres:
    image: postgres:16-alpine
    container_name: minicrm-postgres
    env_file: ../../.env.dev.local
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ../../postgres:/var/lib/postgresql/data
